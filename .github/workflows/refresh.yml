# Daily data refresh: runs the data scripts every morning, commits whatever
# changed, and publishes. No AI involved: these steps are fixed scripts. (The
# Claude routine still runs at 12:00 UTC, only to look for new 2028 polls,
# which needs judgment.)
#
#   until Nov 3, 2026:  Senate/House polls and races (fetch_midterms.py)
#   every day:          market prices, approval, unemployment (fetch_markets.py)
#   after Nov 3, 2026:  election results and the forecast's score (score_forecast.py)
#   then:               rebuild the site data (adds today's tracker points), test, commit, publish
#
# A failed fetch keeps the previous day's data and shows a warning on the run;
# the build and the daily tracker point still happen. Failed fetches and suspicious
# data (fetch_midterms.py's day-over-day comparison) open a GitHub issue, which emails the owner.
name: Daily data refresh

on:
  schedule:
    - cron: "0 11 * * *"     # 11:00 UTC: 7am Eastern (6am after clocks change), before any polls close
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      test_report:
        description: "Send a test data-check report (opens or comments on the GitHub issue)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml"]   # runs once whenever this file changes, as a test

permissions:
  contents: write            # to commit the refreshed data
  issues: write              # to report suspicious data as a GitHub issue
  pages: write               # for the publish step
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Is it after Election Day?
        id: when
        run: echo "after=$([ "$(TZ=America/New_York date +%F)" \> 2026-11-03 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Senate and House polls and races
        if: steps.when.outputs.after == 'no'
        run: |
          python fetch_midterms.py || {
            echo "::warning::fetch_midterms.py failed; keeping yesterday's Senate/House data"
            echo "- fetch_midterms.py failed its own checks, so the site kept yesterday's Senate/House data. See this run's log." >> fetch_warnings.txt
            git checkout -- data/senate_2026_races.csv data/senate_2026_polls.csv data/house_2026_districts.csv data/generic_ballot_2026.csv
          }

      - name: Market prices, approval, unemployment
        run: |
          python fetch_markets.py || {
            echo "::warning::fetch_markets.py couldn't update anything"
            echo "- fetch_markets.py couldn't update market prices, approval or unemployment; the forecast used yesterday's." >> fetch_warnings.txt
          }

      - name: Election results and score
        if: steps.when.outputs.after == 'yes'
        run: python score_forecast.py || echo "::notice::No 2026 results to score yet"

      - name: Build the site data
        run: python build_site.py | tee build.log

      - name: Check before committing
        run: python -m pytest -q && python check_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site          # site/: the pages' version tags change with the data
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          summary=$(grep -m1 "^Forecast" build.log | sed 's/; 2028.*//' || true)
          git commit -m "Daily data refresh" -m "$summary"
          git pull --rebase origin main
          git push origin HEAD:main

      # If the data looked wrong (a race's polls dropped by half or more, a matchup changed,
      # or a fetch failed), open a GitHub issue so the owner gets an email. One open issue
      # at a time: later days add a comment to it instead of opening another.
      - name: Report anything that looked wrong
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.test_report }}" = "true" ]; then
            echo "- TEST: this is a test of the data-check report, started from the Run workflow button. Nothing is wrong; close this issue." >> fetch_warnings.txt
          fi
          [ -s fetch_warnings.txt ] || { echo "No data warnings"; exit 0; }
          {
            echo "The daily refresh on $(TZ=America/New_York date +%F) found something that looks like a misread page:"
            echo
            cat fetch_warnings.txt
            echo
            echo "Races whose polls dropped were kept with yesterday's polls as well, so the site didn't lose them."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue.md
          gh label create data-check --color d93f0b --description "Daily refresh found suspicious data" --force
          open=$(gh issue list --label data-check --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file issue.md
          else gh issue create --title "Data check: something looked wrong in the daily refresh" --label data-check --body-file issue.md
          fi

  publish:
    needs: refresh
    uses: ./.github/workflows/pages.yml
